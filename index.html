<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Casting</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Casting meeting page. Only served from GitHub Pages (tools/pages/build-pages.sh); the IFP's :8080 serves portal.html. -->
  <header>
    <div class="wrap">
      <div class="brand">Casting<span data-i18n="brandSub">教室會議</span></div>
      <span class="status" id="status" data-state="idle" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="wrap">
    <section id="entry" class="entry">
      <div>
        <h1 id="title" tabindex="-1"></h1>
        <p id="notice" class="notice" role="alert" hidden></p>
        <p id="intro" class="intro"></p>
        <div id="roles">
          <button class="role" type="button" data-speaker="yes"><strong data-i18n="speaker">演講者</strong><small data-i18n="speakerDesc"></small><span class="arrow" aria-hidden="true">→</span></button>
          <button class="role" type="button" data-speaker="no"><strong data-i18n="audience">聽眾</strong><small data-i18n="audienceDesc"></small><span class="arrow" aria-hidden="true">→</span></button>
        </div>
        <form id="gate" hidden novalidate>
          <label for="pin" data-i18n="pinLabel"></label>
          <div class="pinrow">
            <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" aria-describedby="error">
            <button id="pinBtn" class="primary" type="submit" data-i18n="joinMeeting"></button>
          </div>
          <p id="error" role="alert"></p>
          <button class="link" id="back" type="button" data-i18n="backToRoles"></button>
          <p class="lan" data-i18n="lanPermission"></p>
        </form>
      </div>
      <figure>
        <div class="board">
          <div class="over" data-i18n="ifpLabel"></div>
          <code class="ifp-addr" id="ifpAddr"></code>
          <div class="tag" data-i18n="pinWhere"></div>
        </div>
      </figure>
    </section>

    <section id="room" hidden>
      <div class="bar"><b id="identity"></b><button id="leave" class="link" type="button" data-i18n="leaveMeeting"></button></div>
      <div class="roomgrid">
        <section>
          <h1 id="workspaceTitle" tabindex="-1"></h1>
          <div id="stage" class="stage off">
            <p id="idle"></p>
            <video id="receiveVideo" autoplay muted playsinline tabindex="0" hidden></video>
          </div>
          <div class="control">
            <span id="mediaStatus" role="status"></span>
            <div class="buttons">
              <button id="media" class="primary" type="button"></button>
              <button id="unmute" class="tool" type="button" data-i18n="unmute" hidden></button>
              <button id="fullscreen" class="tool" type="button" data-i18n="fullscreen" hidden></button>
            </div>
          </div>
        </section>
        <aside id="shareRoot"></aside>
      </div>
      <details id="advanced" class="advanced">
        <summary data-i18n="advanced"></summary>
        <div id="castStats" class="stats"></div>
        <div id="receiveStats" class="stats"></div>
      </details>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="fingerprints.js"></script>
  <script src="wt.js"></script>
  <script src="remote-input.js"></script>
  <script src="whep.js"></script>
  <script src="rtccast.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
