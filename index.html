<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Casting</title>
  <meta name="casting-build" content="pages">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pages">
  <!-- Icon sprite (VSDS paths, currentColor). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-ifp" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M4.99922 4.2002C3.45282 4.2002 2.19922 5.4538 2.19922 7.0002V17.0002C2.19922 18.5466 3.45282 19.8002 4.99922 19.8002H18.9992C20.5456 19.8002 21.7992 18.5466 21.7992 17.0002V7.0002C21.7992 5.4538 20.5456 4.2002 18.9992 4.2002H4.99922ZM3.79922 7.0002C3.79922 6.33745 4.33648 5.8002 4.99922 5.8002H18.9992C19.662 5.8002 20.1992 6.33745 20.1992 7.0002V14.7002H3.79922V7.0002ZM3.79922 16.3002V17.0002C3.79922 17.6629 4.33648 18.2002 4.99922 18.2002H18.9992C19.662 18.2002 20.1992 17.6629 20.1992 17.0002V16.3002H3.79922Z"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M6.49922 5.2002C4.95282 5.2002 3.69922 6.4538 3.69922 8.0002V14.0002C3.69922 15.5466 4.95282 16.8002 6.49922 16.8002H17.4992C19.0456 16.8002 20.2992 15.5466 20.2992 14.0002V8.0002C20.2992 6.4538 19.0456 5.2002 17.4992 5.2002H6.49922ZM5.29922 8.0002C5.29922 7.33745 5.83648 6.8002 6.49922 6.8002H17.4992C18.162 6.8002 18.6992 7.33745 18.6992 8.0002V14.0002C18.6992 14.6629 18.162 15.2002 17.4992 15.2002H6.49922C5.83648 15.2002 5.29922 14.6629 5.29922 14.0002V8.0002Z"/><path fill="currentColor" d="M2.99922 18.2002C2.55739 18.2002 2.19922 18.5584 2.19922 19.0002C2.19922 19.442 2.55739 19.8002 2.99922 19.8002H20.9992C21.441 19.8002 21.7992 19.442 21.7992 19.0002C21.7992 18.5584 21.441 18.2002 20.9992 18.2002H2.99922Z"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ifp"/></svg>
      <h1 data-i18n="title">Casting</h1>
    </div>
    <div class="addr"><span data-i18n="addr">IFP 位址</span><code id="ifpAddr"></code></div>
    <div class="state" id="stateRow" data-state="idle" role="status" aria-live="polite">
      <span class="dot"></span><span id="status"></span>
    </div>
  </header>

  <main class="layout">

    <!-- PC -> IFP: side panel (on the Pages build this is the single centered card). -->
    <aside class="side">
      <section class="card">

        <!-- Pages build only: laptop -> IFP picture and the idle / casting headline. -->
        <div class="pages-only pg-hero" aria-hidden="true">
          <svg class="pg-laptop" viewBox="0 0 24 24"><use href="#i-laptop"/></svg>
          <svg class="pg-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg>
          <svg class="pg-ifp" viewBox="0 0 24 24"><use href="#i-ifp"/></svg>
        </div>
        <div class="pages-only pg-text">
          <h2 class="pg-idle" data-i18n="castTitle">把電腦畫面投到 IFP</h2>
          <h2 class="pg-casting" data-i18n="castingTitle">正在投放到 IFP</h2>
          <p class="pg-idle" data-i18n="castLanNote"></p>
          <p class="pg-casting" data-i18n="castKeepOpen"></p>
        </div>

        <button id="castBtn" class="btn primary" type="button" data-i18n="castBtn">投放到 IFP</button>
        <button id="stopCastBtn" class="btn stop" type="button" data-i18n="stop" hidden>停止投放</button>
        <p id="castHint" class="hint" hidden></p>

        <!-- PIN gate for casting only: shown when casting is requested without a valid session cookie. -->
        <form id="pinView" class="pin" hidden>
          <label for="pinInput" data-i18n="pinLabel">IFP 上顯示的 6 位數 PIN</label>
          <input id="pinInput" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" size="8">
          <div id="pinError"></div>
          <button id="pinBtn" class="btn primary" type="submit" data-i18n="pinOk">開始投放</button>
          <button id="pinCancelBtn" class="btn quiet" type="button" data-i18n="pinCancel">取消</button>
        </form>

        <div class="pages-only pg-note pg-idle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/></svg>
          <span data-i18n="lanPermission"></span>
        </div>

      </section>

      <details id="advanced" class="advanced">
        <summary data-i18n="advanced">進階設定</summary>
        <div class="diag-title" data-i18n="diag">診斷資訊</div>
        <div id="castStats" class="stats"></div>
      </details>
    </aside>

    <!-- Pages build only: where to watch the IFP screen. The link is filled in by app.js from ?ip=. -->
    <p id="viewRow" class="pages-only pg-foot" hidden><span data-i18n="viewPre"></span><a id="viewLink" href="#"></a></p>
  </main>

  <script src="common.js"></script>
  <script src="fingerprints.js"></script>
  <script src="wt.js"></script>
  <script src="rtccast.js"></script>
  <script src="app.js"></script>
</body>
</html>
